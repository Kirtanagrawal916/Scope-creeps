version: '3.8'

services:
  # ---------------------------------------------------------
  # Web Application & API Server
  # ---------------------------------------------------------
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopeguard-web
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------
  # Redis Server for Caching & Queue Workers (Priority 4)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scopeguard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------
  # Prometheus Telemetry & System Monitoring (Priority 4)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: scopeguard-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - web-app

volumes:
  redis-data:
